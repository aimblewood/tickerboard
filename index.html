<!doctype html>
<html lang="en-GB">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<style>:root{color-scheme:light;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0;font:14px system-ui,sans-serif}img{max-width:100%}[hidden]{display:none!important}</style>
</head>
<body>
<title>Tickerboard</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500..700&family=JetBrains+Mono:wght@400;500;600&family=Onest:wght@400;500;600&display=swap">
<style>
/* Layout: a live ticker tape across the top, the portfolio headline strip, then a two-pane desk: watchlist board left, focused instrument right. One column under 960px. */
:root{
  --ground:#F2F3F5; --panel:#FFFFFF; --sunk:#ECEEF1; --line:#DEE2E7; --line-strong:#C8CED6;
  --ink:#11151B; --ink-2:#3D4551; --muted:#677080;
  --brass:#95600A; --brass-ink:#FFFFFF; --brass-soft:rgba(149,96,10,.10);
  --up:#0A8553; --up-soft:rgba(10,133,83,.10); --down:#C7372F; --down-soft:rgba(199,55,47,.09);
  --tape-bg:#12161C; --tape-ink:#E6E9EE; --tape-muted:#8B94A2; --tape-line:rgba(255,255,255,.07); --tape-up:#45D196; --tape-down:#FF7B71;
  --shadow:0 1px 2px rgba(17,21,27,.04),0 10px 28px -16px rgba(17,21,27,.16);
  --pop-shadow:0 22px 48px -18px rgba(17,21,27,.28);
  --font-display:'Bricolage Grotesque','Onest',ui-sans-serif,system-ui,sans-serif;
  --font-ui:'Onest',ui-sans-serif,system-ui,-apple-system,'Segoe UI',sans-serif;
  --font-mono:'JetBrains Mono',ui-monospace,'SFMono-Regular',Menlo,Consolas,monospace;
  --r:16px; --r-sm:10px;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --ground:#0B0E12; --panel:#12161C; --sunk:#0E1217; --line:#222833; --line-strong:#303846;
    --ink:#E8EBEF; --ink-2:#B6BDC8; --muted:#7D8695;
    --brass:#E6AC47; --brass-ink:#1B1304; --brass-soft:rgba(230,172,71,.13);
    --up:#35C88B; --up-soft:rgba(53,200,139,.13); --down:#F26C62; --down-soft:rgba(242,108,98,.13);
    --tape-bg:#06080B; --tape-ink:#E2E6EB; --tape-muted:#7A8391; --tape-line:rgba(255,255,255,.06); --tape-up:#3FD094; --tape-down:#FF7B71;
    --shadow:0 1px 0 rgba(255,255,255,.02) inset,0 12px 30px -16px rgba(0,0,0,.7);
    --pop-shadow:0 22px 48px -18px rgba(0,0,0,.75);
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --ground:#0B0E12; --panel:#12161C; --sunk:#0E1217; --line:#222833; --line-strong:#303846;
  --ink:#E8EBEF; --ink-2:#B6BDC8; --muted:#7D8695;
  --brass:#E6AC47; --brass-ink:#1B1304; --brass-soft:rgba(230,172,71,.13);
  --up:#35C88B; --up-soft:rgba(53,200,139,.13); --down:#F26C62; --down-soft:rgba(242,108,98,.13);
  --tape-bg:#06080B; --tape-ink:#E2E6EB; --tape-muted:#7A8391; --tape-line:rgba(255,255,255,.06); --tape-up:#3FD094; --tape-down:#FF7B71;
  --shadow:0 1px 0 rgba(255,255,255,.02) inset,0 12px 30px -16px rgba(0,0,0,.7);
  --pop-shadow:0 22px 48px -18px rgba(0,0,0,.75);
  color-scheme:dark;
}
*,*::before,*::after{box-sizing:border-box}
body{margin:0;background:var(--ground);color:var(--ink);font-family:var(--font-ui);font-size:14px;line-height:1.45;-webkit-font-smoothing:antialiased;text-rendering:optimizeLegibility}
button,input,select{font:inherit;color:inherit}
a{color:inherit}
:focus-visible{outline:2px solid var(--brass);outline-offset:2px}
.num{font-variant-numeric:tabular-nums}
.mono{font-family:var(--font-mono)}
.vh{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}

/* Tape */
.tape{background:var(--tape-bg);color:var(--tape-ink);overflow:hidden;position:relative;padding-top:env(safe-area-inset-top,0px)}
.tape::before,.tape::after{content:"";position:absolute;top:0;bottom:0;width:56px;z-index:1;pointer-events:none}
.tape::before{left:0;background:linear-gradient(90deg,var(--tape-bg),transparent)}
.tape::after{right:0;background:linear-gradient(-90deg,var(--tape-bg),transparent)}
.tape-track{display:flex;width:max-content;animation:tape var(--tape-dur,80s) linear infinite}
.tape:hover .tape-track,.tape:focus-within .tape-track{animation-play-state:paused}
@keyframes tape{from{transform:translateX(0)}to{transform:translateX(-50%)}}
.tape-item{display:inline-flex;align-items:baseline;gap:9px;padding:11px 22px;border:0;border-right:1px solid var(--tape-line);background:none;color:inherit;cursor:pointer;white-space:nowrap;font-family:var(--font-mono);font-size:12px;letter-spacing:.01em}
.tape-item:hover .t-l{color:var(--tape-ink)}
.t-l{color:var(--tape-muted);font-weight:500;text-transform:uppercase;letter-spacing:.06em;font-size:11px}
.t-v{font-weight:600;font-variant-numeric:tabular-nums}
.t-c{font-variant-numeric:tabular-nums}
.t-c.up{color:var(--tape-up)} .t-c.down{color:var(--tape-down)} .t-c.flat{color:var(--tape-muted)}
@media (prefers-reduced-motion: reduce){.tape-track{animation:none}.tape{overflow-x:auto}.tape-dup{display:none}}

.app{max-width:1340px;margin:0 auto;padding-inline:16px;padding-block:0 48px}
@media(min-width:720px){.app{padding-inline:28px}}

/* Top bar */
.top{display:flex;flex-wrap:wrap;align-items:center;gap:12px 18px;padding-block:20px 18px}
.brand{display:flex;align-items:center;gap:11px;margin-right:auto;min-width:0}
.mark{width:30px;height:30px;flex:none}
.mark-bg{fill:var(--tape-bg)} .mark-line{fill:none;stroke:var(--brass);stroke-width:2.3;stroke-linecap:round;stroke-linejoin:round} .mark-dot{fill:var(--brass)}
.brand-name{font-family:var(--font-display);font-weight:650;font-size:22px;letter-spacing:-.02em;font-variation-settings:"opsz" 48}
.mkts{display:flex;gap:8px;flex-wrap:wrap}
.mkt{display:inline-flex;align-items:center;gap:7px;height:30px;padding:0 11px;border:1px solid var(--line);border-radius:999px;font-size:12px;color:var(--ink-2);background:var(--panel);white-space:nowrap}
.mkt b{font-weight:600;color:var(--ink)}
.mkt .dot{width:7px;height:7px;border-radius:50%;background:var(--line-strong);flex:none}
.mkt.open .dot{background:var(--up);box-shadow:0 0 0 3px var(--up-soft)}
.controls{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.status{font-size:12px;color:var(--muted);display:flex;align-items:center;gap:6px;min-width:0}
.status .sep{opacity:.5}
.field{display:inline-flex;align-items:center;gap:6px;font-size:12px;color:var(--muted)}
.sel{height:32px;border-radius:9px;border:1px solid var(--line-strong);background:var(--panel);padding:0 6px;font-size:12.5px;color:var(--ink)}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:7px;height:34px;padding:0 14px;border-radius:10px;border:1px solid var(--line-strong);background:var(--panel);cursor:pointer;font-weight:500;font-size:13px;white-space:nowrap;transition:border-color .15s,background .15s}
.btn:hover{border-color:var(--ink-2)}
.btn[disabled]{opacity:.5;cursor:default}
.btn-brass{background:var(--brass);border-color:var(--brass);color:var(--brass-ink);font-weight:600}
.btn-brass:hover{border-color:var(--brass);filter:brightness(1.06)}
.btn-quiet{border-color:transparent;background:transparent;color:var(--ink-2);padding:0 10px}
.btn-quiet:hover{background:var(--sunk);border-color:transparent}
.btn-danger{color:var(--down);border-color:var(--down-soft);background:var(--down-soft)}
.btn-sm{height:30px;font-size:12.5px;padding:0 11px}
.spin{width:14px;height:14px;flex:none}
.loading .spin{animation:spin .9s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}

/* Issue banner */
.issue{display:flex;flex-wrap:wrap;align-items:center;gap:10px 16px;padding:14px 16px;margin-bottom:16px;border-radius:12px;border:1px solid var(--brass);background:var(--brass-soft)}
.issue-t{font-weight:600}
.issue-b{color:var(--ink-2);flex:1 1 320px;min-width:0}

/* Hero strip */
.hero{display:grid;grid-template-columns:minmax(0,1.7fr) minmax(0,1.1fr) minmax(0,1fr) minmax(0,1fr);background:var(--panel);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--shadow);margin-bottom:18px;overflow:hidden}
.hc{padding:20px 22px;min-width:0;border-left:1px solid var(--line);display:flex;flex-direction:column;gap:8px}
.hc:first-child{border-left:0}
@media(max-width:1060px){.hero{grid-template-columns:repeat(3,minmax(0,1fr))}.hc-port{grid-column:1/-1;border-bottom:1px solid var(--line)}.hc-port + .hc{border-left:0}}
@media(max-width:620px){.hero{grid-template-columns:repeat(2,minmax(0,1fr))}.hc-breadth{grid-column:1/-1;border-bottom:1px solid var(--line)}.hc-breadth + .hc{border-left:0}}
.eyebrow{font-size:11px;letter-spacing:.09em;text-transform:uppercase;color:var(--muted);font-weight:600}
.big{font-family:var(--font-display);font-weight:600;font-size:clamp(34px,4.4vw,50px);line-height:1;letter-spacing:-.03em;font-variation-settings:"opsz" 96;font-variant-numeric:tabular-nums;overflow-wrap:anywhere}
.mid{font-family:var(--font-display);font-weight:600;font-size:26px;line-height:1.05;letter-spacing:-.02em;font-variation-settings:"opsz" 72;font-variant-numeric:tabular-nums}
.hline{display:flex;flex-wrap:wrap;align-items:center;gap:6px 10px;font-size:13px;color:var(--ink-2)}
.hint{color:var(--muted);font-size:13px;max-width:44ch}
.pill{display:inline-flex;align-items:center;padding:3px 8px;border-radius:7px;font-size:12.5px;font-weight:600;font-variant-numeric:tabular-nums;white-space:nowrap}
.pill.up{color:var(--up);background:var(--up-soft)} .pill.down{color:var(--down);background:var(--down-soft)} .pill.flat{color:var(--muted);background:var(--sunk)}
.tone-up{color:var(--up)} .tone-down{color:var(--down)} .tone-flat{color:var(--muted)}
.breadth-bar{display:flex;height:8px;border-radius:99px;overflow:hidden;background:var(--sunk);gap:2px}
.breadth-bar i{display:block;height:100%}
.breadth-bar .bu{background:var(--up)} .breadth-bar .bd{background:var(--down)} .breadth-bar .bf{background:var(--line-strong)}
.mover{display:flex;flex-direction:column;align-items:flex-start;gap:6px;background:none;border:0;padding:0;text-align:left;cursor:pointer;color:inherit;min-width:0}
.mover .nm{color:var(--ink-2);font-size:12.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:100%}

/* Desk */
.desk{display:grid;grid-template-columns:minmax(0,1.42fr) minmax(0,1fr);gap:18px;align-items:start}
@media(max-width:959px){.desk{grid-template-columns:minmax(0,1fr)}}
.panel{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--shadow);min-width:0}
.board-head{display:flex;align-items:center;gap:10px;padding:18px 20px 12px}
.board-head h2{font-family:var(--font-display);font-size:19px;font-weight:620;margin:0;letter-spacing:-.015em;font-variation-settings:"opsz" 36}
.count{font-family:var(--font-mono);font-size:11px;color:var(--muted);border:1px solid var(--line);border-radius:6px;padding:1px 7px}
.board-head .field{margin-left:auto}

.search{position:relative;margin:0 20px 14px}
.search input{width:100%;height:44px;border-radius:12px;border:1px solid var(--line-strong);background:var(--sunk);padding:0 44px 0 40px;font-size:14px;transition:border-color .15s,background .15s,box-shadow .15s}
.search input::placeholder{color:var(--muted)}
.search input:focus{border-color:var(--brass);background:var(--panel);outline:none;box-shadow:0 0 0 4px var(--brass-soft)}
.search input:disabled{opacity:.6}
.search .ico{position:absolute;left:13px;top:13px;width:18px;height:18px;color:var(--muted);pointer-events:none}
.search kbd{position:absolute;right:11px;top:11px;font-family:var(--font-mono);font-size:11px;color:var(--muted);border:1px solid var(--line);border-radius:6px;padding:2px 7px;background:var(--panel)}
.dropdown{position:absolute;left:0;right:0;top:calc(100% + 6px);z-index:30;background:var(--panel);border:1px solid var(--line-strong);border-radius:14px;box-shadow:var(--pop-shadow);padding:6px;margin:0;list-style:none;max-height:360px;overflow:auto}
.opt{display:grid;grid-template-columns:minmax(78px,auto) minmax(0,1fr) auto;gap:12px;align-items:center;padding:10px 10px;border-radius:9px;cursor:pointer}
.opt[aria-selected="true"]{background:var(--sunk)}
.opt .tk{font-family:var(--font-mono);font-weight:600;font-size:12.5px}
.opt .on{font-size:11px;color:var(--brass);font-weight:600;white-space:nowrap}
.opt .nm{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.opt .ex{font-size:11.5px;color:var(--muted);white-space:nowrap}
.dd-note{padding:12px 10px;color:var(--muted);font-size:13px;display:flex;align-items:center;gap:8px}

.starter{display:flex;flex-wrap:wrap;align-items:center;gap:8px 12px;margin:0 20px 14px;padding:10px 12px;border-radius:11px;background:var(--sunk);font-size:12.5px;color:var(--ink-2)}
.starter span{flex:1 1 240px;min-width:0}

.list-head,.row{display:grid;grid-template-columns:minmax(0,1.7fr) 108px minmax(86px,.75fr) minmax(108px,.8fr);gap:14px;align-items:center}
.board.has-pos .list-head,.board.has-pos .row{grid-template-columns:minmax(0,1.5fr) 96px minmax(84px,.65fr) minmax(92px,.65fr) minmax(150px,1fr)}
@media(min-width:720px) and (max-width:1200px){
  .board.has-pos .list-head,.board.has-pos .row{grid-template-columns:minmax(0,1.4fr) minmax(84px,.65fr) minmax(92px,.65fr) minmax(140px,1fr)}
  .board.has-pos .c-spark{display:none}
}
.list-head{padding:9px 20px;font-size:10.5px;color:var(--muted);text-transform:uppercase;letter-spacing:.08em;font-weight:600;border-top:1px solid var(--line);border-bottom:1px solid var(--line);background:var(--sunk)}
.list-head .r,.row .r{text-align:right;justify-self:end}
.board:not(.has-pos) .c-pos{display:none}
.rows{list-style:none;margin:0;padding:0}
.rows li{border-bottom:1px solid var(--line)}
.rows li:last-child{border-bottom:0}
.row{width:100%;text-align:left;padding:13px 20px;border:0;background:transparent;cursor:pointer;color:inherit;transition:background .12s}
.row:hover{background:var(--sunk)}
.row[aria-current="true"]{background:var(--brass-soft)}
.row[aria-current="true"] .tk{background:var(--brass);color:var(--brass-ink);border-color:var(--brass)}
.ins{display:flex;flex-direction:column;gap:3px;min-width:0}
.ins-top{display:flex;align-items:center;gap:8px;min-width:0}
.tk{font-family:var(--font-mono);font-weight:600;font-size:11.5px;letter-spacing:.02em;padding:2px 7px;border-radius:6px;border:1px solid var(--line-strong);background:var(--panel);white-space:nowrap;flex:none}
.ins .nm{font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0}
.ins .sub{font-size:11.5px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.price{font-weight:600;font-size:15px;font-variant-numeric:tabular-nums;white-space:nowrap}
.chg{display:flex;flex-direction:column;align-items:flex-end;gap:3px}
.chg .abs{font-size:11.5px;color:var(--muted);font-variant-numeric:tabular-nums;white-space:nowrap}
.pos{display:flex;flex-direction:column;align-items:flex-end;gap:2px;font-variant-numeric:tabular-nums;white-space:nowrap}
.pos .v{font-weight:600}
.pos .g{font-size:11.5px}
.err-txt{font-size:12px;color:var(--down)}
.spark{display:block;width:100%;max-width:108px;height:34px}
.spark-line{fill:none;stroke-width:1.5;stroke-linejoin:round;stroke-linecap:round}
.spark-line.up,.ch-line.up{stroke:var(--up)} .spark-line.down,.ch-line.down{stroke:var(--down)} .spark-line.flat,.ch-line.flat{stroke:var(--muted)}
.spark-area.up{fill:var(--up-soft)} .spark-area.down{fill:var(--down-soft)} .spark-area.flat{fill:var(--sunk)}
.spark-dot.up{fill:var(--up)} .spark-dot.down{fill:var(--down)} .spark-dot.flat{fill:var(--muted)}
.spark-base{stroke:var(--line-strong);stroke-width:1;stroke-dasharray:2 3}
@media(max-width:719px){
  .list-head{display:none}
  .row,.board.has-pos .row{grid-template-columns:minmax(0,1fr) 72px minmax(84px,auto);grid-template-areas:"ins spark price" "ins spark chg";row-gap:3px;padding:12px 16px}
  .row .c-ins{grid-area:ins}.row .c-spark{grid-area:spark}.row .c-price{grid-area:price}.row .c-chg{grid-area:chg}
  .board.has-pos .c-pos{display:none}
  .chg .abs{display:none}
  .ins-top{flex-wrap:wrap;row-gap:4px}
  .ins .nm{flex-basis:100%}
  .board-head,.search,.starter{margin-inline:0}
  .board-head{padding-inline:16px}.search{margin-inline:16px}.starter{margin-inline:16px}
}

.empty{padding:34px 22px 30px;display:flex;flex-direction:column;align-items:flex-start;gap:12px}
.empty h3{margin:0;font-family:var(--font-display);font-size:20px;font-weight:600;letter-spacing:-.015em}
.empty p{margin:0;color:var(--muted);max-width:52ch}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{display:inline-flex;align-items:center;gap:7px;height:32px;padding:0 12px;border-radius:999px;border:1px solid var(--line-strong);background:var(--panel);cursor:pointer;font-size:12.5px}
.chip:hover{border-color:var(--brass)}
.chip .mono{font-size:11.5px;color:var(--muted)}

/* Skeleton */
.sk{display:inline-block;border-radius:6px;background:linear-gradient(90deg,var(--sunk) 0%,var(--line) 50%,var(--sunk) 100%);background-size:200% 100%;animation:sk 1.4s ease-in-out infinite}
@keyframes sk{from{background-position:100% 0}to{background-position:-100% 0}}
@media (prefers-reduced-motion: reduce){.sk{animation:none}}

/* Detail */
.detail{position:sticky;top:16px;padding:22px 22px 18px;display:flex;flex-direction:column;gap:16px}
@media(max-width:959px){.detail{position:static;scroll-margin-top:12px}}
.d-top{display:flex;align-items:center;gap:8px;flex-wrap:wrap;font-size:12px;color:var(--muted)}
.d-top .tk{background:var(--brass);color:var(--brass-ink);border-color:var(--brass)}
.d-top a{margin-left:auto;color:var(--ink-2);text-decoration:none;font-size:12px;border-bottom:1px solid var(--line-strong)}
.d-top a:hover{color:var(--ink);border-color:var(--ink)}
.d-name{margin:6px 0 0;font-family:var(--font-display);font-weight:600;font-size:22px;letter-spacing:-.02em;line-height:1.15;font-variation-settings:"opsz" 48;text-wrap:balance}
.d-price{display:flex;flex-wrap:wrap;align-items:baseline;gap:6px 12px;margin-top:6px}
.d-price .big{font-size:clamp(34px,3.6vw,44px)}
.d-asof{font-size:12px;color:var(--muted);margin-top:4px}
.ranges{display:flex;gap:2px;padding:3px;background:var(--sunk);border-radius:11px;overflow-x:auto;scrollbar-width:none}
.ranges button{flex:1 0 auto;height:30px;padding:0 10px;border:0;border-radius:8px;background:transparent;cursor:pointer;font-family:var(--font-mono);font-size:11.5px;font-weight:600;color:var(--muted)}
.ranges button:hover{color:var(--ink)}
.ranges button[aria-selected="true"]{background:var(--panel);color:var(--ink);box-shadow:0 1px 2px rgba(0,0,0,.12)}
.chart{position:relative;height:270px;touch-action:pan-y}
@media(max-width:519px){.chart{height:220px}}
.chart svg{display:block;width:100%;height:100%;overflow:visible}
.ch-grid{stroke:var(--line);stroke-width:1}
.ch-ax{fill:var(--muted);font-family:var(--font-mono);font-size:10.5px}
.ch-base{stroke:var(--ink-2);stroke-width:1;stroke-dasharray:3 4;opacity:.5}
.ch-base-t{fill:var(--muted);font-family:var(--font-mono);font-size:9.5px}
.ch-line{fill:none;stroke-width:1.9;stroke-linejoin:round;stroke-linecap:round}
.stop-a.up{stop-color:var(--up);stop-opacity:.26} .stop-b.up{stop-color:var(--up);stop-opacity:0}
.stop-a.down{stop-color:var(--down);stop-opacity:.24} .stop-b.down{stop-color:var(--down);stop-opacity:0}
.stop-a.flat{stop-color:var(--muted);stop-opacity:.2} .stop-b.flat{stop-color:var(--muted);stop-opacity:0}

function isNum(v){ return typeof v === 'number' && isFinite(v); }
function dpFor(v, type){ if (type === 'CURRENCY') return 4; return Math.abs(v) < 1 ? 4 : 2; }
function fmtPrice(v, cur, type){

  var s = nf(dpFor(v, type)).format(v);

  if (cur === 'GBp' || cur === 'GBX') return s + 'p';

}
function sign(v){ return v > 0 ? '+' : v < 0 ? '−' : ''; }
function fmtSigned(v, cur, type){ if (!isNum(v)) return '—'; return sign(v) + fmtPrice(Math.abs(v), cur, type); }
function fmtPct(p){ if (!isNum(p)) return '—'; return sign(p) + nf(2).format(Math.abs(p * 100)) + '%'; }
function fmtGBP(v, signed){ if (!isNum(v)) return '—'; return signed ? sign(v) + GBPF.format(Math.abs(v)) : GBPF.format(v); }
function fmtVol(v){

}
function fmtQty(v){ return isNum(v) ? (Number.isInteger(v) ? nf(0).format(v) : nf(Math.min(4, (String(v).split('.')[1] || '').length)).format(v)) : '—'; }
function clock(ms){ return new Date(ms).toLocaleTimeString('en-GB', {hour:'2-digit', minute:'2-digit'}); }
function fmtWhen(sec){

  var d = new Date(sec * 1000), now = new Date();
  var t = clock(sec * 1000);

}
function tone(v){ return !isNum(v) || Math.abs(v) < 1e-12 ? 'flat' : v > 0 ? 'up' : 'down'; }
function dayMove(q){

  var prev = isNum(q.previousClose) ? q.previousClose : q.chartPreviousClose;
  if (!isNum(prev) || prev === 0) return null;

}
function isOpen(q, nowS){ return !!(q && q.session && nowS >= q.session.start && nowS < q.session.end); }

/* ---------- Positions ---------- */
function fxToGBP(major){
  if (!major) return null;
  if (major === 'GBP') return 1;
  var q = S.quotes.get(major + 'GBP=X');
  return q && !q.error && isNum(q.price) ? q.price : null;
}
function fxSymbolsNeeded(){
  return uniq(S.items.filter(function(i){ return i.holding; }).map(function(i){
    var q = S.quotes.get(i.symbol);
    var u = unit((q && q.currency) || i.currency);
    return u.major && u.major !== 'GBP' ? u.major + 'GBP=X' : null;
  }));
}
function position(item){
  if (isPractice()) return practicePos(item.symbol);
  var h = item.holding; if (!h) return null;
  var q = S.quotes.get(item.symbol);
  if (!q || q.error || !isNum(q.price)) return {pending:true};
  var u = unit(q.currency || item.currency);
  var fx = fxToGBP(u.major);
  if (fx == null) return {pending:true};
  var px = q.price / u.factor;
  var value = h.qty * px * fx;
  var m = dayMove(q);
  var day = m ? h.qty * (m.ch / u.factor) * fx : null;
  var cost = isNum(h.cost) ? h.qty * (h.cost / u.factor) * fx : null;
  var gain = cost != null ? value - cost : null;
  return {value:value, day:day, cost:cost, gain:gain, gainPct: cost ? gain / cost : null, fx:fx, major:u.major, factor:u.factor};
}
function portfolio(){
  var r = {n:0, value:0, day:0, dayKnown:false, cost:0, costValue:0, pending:0};
  S.items.forEach(function(i){
    var p = position(i); if (!p) return;
    if (p.pending) { r.pending++; return; }
    r.n++; r.value += p.value;
    if (p.day != null) { r.day += p.day; r.dayKnown = true; }
    if (p.cost != null) { r.cost += p.cost; r.costValue += p.value; }
  });
  r.dayPct = r.dayKnown && (r.value - r.day) ? r.day / (r.value - r.day) : null;
  r.gain = r.cost ? r.costValue - r.cost : null;
  r.gainPct = r.cost ? r.gain / r.cost : null;
  return r;
}

function sortedTrades(trades){
  return trades.map(function(t, i){ return {t:t, i:i}; }).sort(function(a, b){

/* Pooled average cost, the way HMRC's Section 104 pool works: buys add shares and cost, sells take out cost pro rata. */
function buildBook(P, trades){
  var pools = {}, cash = P.startCash, realised = 0, costs = 0, ok = true;
  sortedTrades(trades).forEach(function(t){
    var p = pools[t.sym] || (pools[t.sym] = {sym:t.sym, name:t.name, cur:t.cur, type:t.type, qty:0, cost:0, ccy:0});
    p.name = t.name || p.name; p.cur = t.cur || p.cur; p.type = t.type || p.type;
    if (t.side === 'buy') { p.qty += t.qty; p.cost += t.total; p.ccy += t.qty * t.px; cash -= t.total; }
    else {
      if (t.qty > p.qty + 1e-6) ok = false;
      var q = Math.min(t.qty, p.qty), frac = p.qty ? q / p.qty : 0, out = p.cost * frac;
      realised += t.total - out;
      p.cost -= out; p.ccy -= p.ccy * frac; p.qty -= q; cash += t.total;
      if (p.qty < 1e-9) { p.qty = 0; p.cost = 0; p.ccy = 0; }
    }
    costs += (t.stamp || 0) + (t.fee || 0);
  });
  if (cash < -0.01) ok = false;
  return {cash:cash, realised:realised, costs:costs, ok:ok, pools:pools,
    holdings:Object.keys(pools).map(function(k){ return pools[k]; }).filter(function(p){ return p.qty > 1e-9; })};
}
var bookMemo = null;
function book(){
  var P = S.practice; if (!P) return null;
  if (bookMemo && bookMemo.src === P.trades && bookMemo.n === P.trades.length && bookMemo.sc === P.startCash) return bookMemo.b;
  var b = buildBook(P, P.trades);

}
function practicePos(sym){

  var base = {qty:p.qty, cost:p.cost, avg: p.qty ? p.ccy / p.qty : null, cur:p.cur, type:p.type};
  var q = S.quotes.get(sym);
  if (!q || q.error || !isNum(q.price)) return Object.assign(base, {pending:true});
  var u = unit(q.currency || p.cur), fx = fxToGBP(u.major);
  if (fx == null) return Object.assign(base, {pending:true});
  var value = p.qty * q.price / u.factor * fx, m = dayMove(q);
  return Object.assign(base, {value:value, day: m ? p.qty * m.ch / u.factor * fx : null, gain:value - p.cost,
    gainPct: p.cost ? (value - p.cost) / p.cost : null, cur:q.currency || p.cur, type:q.type || p.type, fx:fx, major:u.major});
}
function practiceSummary(){

/* ---------- Price feed (n8n) ---------- */
function asObj(p){ if (typeof p === 'string') { try { return JSON.parse(p); } catch (e) { return null; } } return p; }
function normErr(e){ if (e && typeof e === 'object' && e.code) return e; return {code:'upstream_error', message: String((e && e.message) || e || '')}; }
function callTool(tool, input){
  return mcp.callTool(SERVER, tool, input, {cache:false}).then(function(r){
    return asObj(r && r.payload !== undefined ? r.payload : r);
  }, function(e){ throw normErr(e); });
}
async function runFeed(query){
  if (!mcp) throw {code:'no_mcp'};
  var input = {workflowId: WF_ID, executionMode: 'production', triggerNodeName: 'Price Request', inputs: {webhookData: {method: 'GET', query: query}}};
  var started;
  try { started = await callTool('execute_workflow', input); }
  catch (e) {
    if (!e.retryable) throw e;
    await sleep(Math.max(e.retryAfterMs || 0, 700 + Math.random() * 900));
    started = await callTool('execute_workflow', input);
  }
  var id = started && (started.executionId || started.id);
  if (!id) throw {code:'feed_failed', message:'n8n did not start the price feed.'};
  await sleep(800);
  var t0 = Date.now(), wait = 550;
  while (Date.now() - t0 < 30000) {
    var r;
    try { r = await callTool('get_workflow_execution', {workflowId: WF_ID, executionId: String(id), includeData: true, nodeNames: ['Build Result']}); }
    catch (e) { if (e.retryable || (e.code === 'tool_error' && Date.now() - t0 < 4000)) { await sleep(900); continue; } throw e; }
    var st = r && r.execution && r.execution.status;
    if (st === 'success') {
      var run = r.data && r.data.resultData && r.data.resultData.runData && r.data.resultData.runData['Build Result'];
      var out = run && run[0] && run[0].data && run[0].data.main && run[0].data.main[0] && run[0].data.main[0][0] && run[0].data.main[0][0].json;
      if (!out) throw {code:'feed_failed', runId:id};
      return out;
    }
    if (st && /error|crash|cancel/i.test(st)) throw {code:'feed_failed', runId:id};
    await sleep(wait); wait = Math.min(1200, wait + 150);
  }
  throw {code:'feed_timeout', runId:id};
}
function ingest(out){
  (out && out.results || []).forEach(function(r){
    var key = String(r.requested || r.symbol || '').toUpperCase();
    if (!key) return;
    S.quotes.set(key, r);
  });
}
async function fetchQuotes(symbols){
  var chunks = [];
  for (var i = 0; i < symbols.length; i += 40) chunks.push(symbols.slice(i, i + 40));
  var outs = await Promise.all(chunks.map(function(c){ return runFeed({mode:'quotes', symbols:c.join(','), range:'1d'}); }));
  outs.forEach(ingest);
  return outs[outs.length - 1];
}
function allSymbols(){
  return uniq(S.items.map(function(i){ return i.symbol; }).concat(TAPE.map(function(t){ return t.s; }), fxSymbolsNeeded(), practiceSymbols(), ['USDGBP=X', 'EURGBP=X']));
}
async function refresh(){
  if (!mcp) return;
  if (S.loading) { S.pending = true; return; }
  S.loading = true; clearTimeout(timer); renderStatus();
  try {
    var out = await fetchQuotes(allSymbols());
    S.lastAt = out && out.generatedAt ? Date.parse(out.generatedAt) : Date.now();
    var missingFx = fxSymbolsNeeded().filter(function(s){ return !S.quotes.has(s); });
    if (missingFx.length) await fetchQuotes(missingFx);
    S.issue = null;
  } catch (e) {
    S.issue = normErr(e);
  }
  S.loading = false;
  renderAll();
  schedule();
  if (S.pending) { S.pending = false; refresh(); }
}
function schedule(){
  clearTimeout(timer); timer = null; S.autoNote = '';
  if (!mcp || (S.issue && BLOCKING[S.issue.code])) { renderStatus(); return; }
  var mins = Number(prefs.auto) || 0;
  if (!mins) { S.autoNote = 'Auto-refresh off'; renderStatus(); return; }
  var nowS = Date.now() / 1000, delay;
  var watch = S.items.map(function(i){ return i.symbol; }).concat(MARKETS.map(function(m){ return m.s; }));
  var qs = watch.map(function(s){ return S.quotes.get(s); }).filter(function(q){ return q && !q.error && LIVE_TYPES[q.type]; });
  if (!qs.length || qs.some(function(q){ return isOpen(q, nowS); })) {
    delay = mins * 60000;
    S.autoNote = 'Next ' + clock(Date.now() + delay);
  } else {
    var starts = qs.map(function(q){ return q.session && q.session.start; }).filter(function(s){ return s && s > nowS; });
    if (starts.length) {
      var next = Math.min.apply(null, starts);
      delay = Math.max(60000, (next - nowS) * 1000 + 90000);
      S.autoNote = 'Markets shut, resumes ' + clock(next * 1000);
    } else {
      delay = 3600000;
      S.autoNote = 'Markets shut, checking hourly';
    }
  }
  timer = setTimeout(function(){
    if (document.hidden) { S.missedTick = true; return; }
    refresh();
  }, delay);
  renderStatus();
}

  if (!document.hidden && S.missedTick) { S.missedTick = false; refresh(); }
});

/* ---------- Issue copy ---------- */
function issueText(e){
  var c = e && e.code;
  switch (c) {
    case 'no_mcp': case 'not_granted': case 'capability_disabled': case 'capability_removed':
      return {t:'Live prices aren’t available in this view', b:'Prices come through your n8n connector, which works when this page is open in Claude.'};
    case 'needs_reauth':
      return {t:'Reconnect n8n', b:'Your n8n connection has lapsed. Reconnect n8n in claude.ai Settings → Connectors, then press Refresh.', a:'refresh'};
    case 'server_not_connected': case 'server_not_found':
      return {t:'Add the n8n connector', b:'Tickerboard fetches prices through n8n. Add n8n in claude.ai Settings → Connectors, then press Refresh.', a:'refresh'};
    case 'selection_required':
      return {t:'Choose your n8n connection', b:'You have more than one n8n connector. Pick one when Claude asks, then press Refresh.', a:'refresh'};
    case 'not_in_manifest': case 'consent_required':
      return {t:'n8n isn’t allowed for this page', b:'Allow n8n so Tickerboard can run your price feed.', a:'manage'};
    case 'approval_required':
      return {t:'n8n needs your approval', b:'Approve the price feed run to load prices.', a:'refresh', al:'Approve and load'};
    case 'blocked_by_policy':
      return {t:'n8n is blocked here', b:'Your organisation’s policy blocks n8n for this page.'};
    case 'tool_error':
      return {t:'n8n reported a problem', b:(e.message ? e.message + ' ' : '') + 'Check that “' + WF_NAME + '” is published in n8n.', a:'refresh'};
    case 'feed_failed':
      return {t:'The price feed failed', b:'n8n run' + (e.runId ? ' #' + e.runId : '') + ' ended with an error. Open “' + WF_NAME + '” in n8n to see why.', a:'refresh'};
    case 'feed_timeout':
      return {t:'The price feed is slow to answer', b:'n8n didn’t finish within 30 seconds. Try again in a moment.', a:'refresh'};
    case 'server_unavailable': case 'rate_limited':
      return {t:'n8n didn’t answer', b:'The connector was unreachable just now. Try again in a moment.', a:'refresh'};
    case 'no_data':
      return {t:'No history for this range', b:e.message || ''};
    default:
      return {t:'Prices couldn’t load', b:(e && e.message) || 'Something went wrong reaching n8n.', a:'refresh'};
  }
}

function sortedItems(){
  var arr = boardItems().slice();
  function pct(i){ var m = dayMove(S.quotes.get(i.symbol)); return m ? m.pct : null; }
  function val(i){ var p = position(i); return p && !p.pending ? p.value : -1; }
  var by = {
    movers: function(a, b){ return Math.abs(pct(b) || 0) - Math.abs(pct(a) || 0); },
    change: function(a, b){ var x = pct(a), y = pct(b); return (y == null ? -Infinity : y) - (x == null ? -Infinity : x); },
    loss: function(a, b){ var x = pct(a), y = pct(b); return (x == null ? Infinity : x) - (y == null ? Infinity : y); },
    name: function(a, b){ return (a.name || a.symbol).localeCompare(b.name || b.symbol); },
    value: function(a, b){ return val(b) - val(a); }
  }[prefs.sort];
  if (by) arr.sort(by);
  return arr;
}
function spark(q){
  var W = 108, H = 34;
  var svg = sv('svg', {viewBox:'0 0 ' + W + ' ' + H, class:'spark', 'aria-hidden':'true', preserveAspectRatio:'none'});
  var pts = q.points || [];
  if (pts.length < 2) return svg;
  var dom = dayDomain(q) || [pts[0][0], pts[pts.length - 1][0]];
  var m = dayMove(q), base = m ? m.prev : null;
  var vals = pts.map(function(p){ return p[1]; });
  var lo = Math.min.apply(null, vals), hi = Math.max.apply(null, vals);
  if (base != null) { lo = Math.min(lo, base); hi = Math.max(hi, base); }
  if (hi === lo) { hi += 1; lo -= 1; }
  function X(t){ return 1 + (t - dom[0]) / ((dom[1] - dom[0]) || 1) * (W - 4); }
  function Y(v){ return 3 + (hi - v) / (hi - lo) * (H - 6); }
  var d = pts.map(function(p, i){ return (i ? 'L' : 'M') + X(p[0]).toFixed(1) + ' ' + Y(p[1]).toFixed(1); }).join('');
  var t = tone(m && m.ch);
  var lx = X(pts[pts.length - 1][0]), fx = X(pts[0][0]);
  if (base != null) svg.append(sv('line', {x1:0, x2:W, y1:Y(base).toFixed(1), y2:Y(base).toFixed(1), class:'spark-base'}));
  svg.append(sv('path', {d: d + 'L' + lx.toFixed(1) + ' ' + H + 'L' + fx.toFixed(1) + ' ' + H + 'Z', class:'spark-area ' + t}));
  svg.append(sv('path', {d:d, class:'spark-line ' + t}));
  svg.append(sv('circle', {cx:lx.toFixed(1), cy:Y(pts[pts.length - 1][1]).toFixed(1), r:2.3, class:'spark-dot ' + t}));
  return svg;
}

/* ---------- Charts ---------- */
function dayDomain(q){

    var s = q.session.start, e = q.session.end, len = e - s;
    if (last >= s - 60) return [Math.min(s, first), Math.max(e, last)];
    if (len > 0 && len < 20 * 3600) return [first, Math.max(last, first + len)];

}
function niceTicks(lo, hi, n){

  var step0 = span / n, mag = Math.pow(10, Math.floor(Math.log10(step0))), err = step0 / mag;

}

}
function tipWhen(t, range){

  return d.toLocaleDateString('en-GB', {day:'numeric', month:'short', year:'numeric'});
}

    if (range === '5y' || range === 'max') return d.getFullYear();
    if (range === '1mo') return Math.floor((t / 86400 + 3) / 7);
    return d.getFullYear() + '-' + d.getMonth();

  if (!/^\d{4}-\d{2}-\d{2}$/.test(date)) { tk.hist = {date:date, error:'Pick a valid date.'}; renderTicketPreview(); return; }
  var parts = date.split('-').map(Number), dayStart = Date.UTC(parts[0], parts[1] - 1, parts[2]) / 1000;
  if (dayStart >= Date.now() / 1000 - 43200) { tk.hist = {date:date, error:'Backdated buys need a date before today.'}; renderTicketPreview(); return; }
  var q = S.quotes.get(sym), u = unit(q && q.currency), fxSym = u.major && u.major !== 'GBP' ? u.major + 'GBP=X' : null;
  tk.hist = {date:date, loading:true}; renderTicketPreview();
  function closeOn(rr){ if (!rr || rr.error) return null; var best = null; (rr.points || []).forEach(function(p){ if (p[0] < dayStart + 86400) best = p; }); return best; }
  try {
    var out = await runFeed({mode:'chart', symbols:[sym].concat(fxSym ? [fxSym] : []).join(','), from:String(dayStart - 12 * 86400), to:String(dayStart + 2 * 86400)});
    var res = out.results || [];
    var r = res.find(function(x){ return String(x.requested || '').toUpperCase() === sym; });
    var fr = fxSym ? res.find(function(x){ return String(x.requested || '').toUpperCase() === fxSym; }) : null;
    var p = closeOn(r);
    if (!p) throw {code:'no_data', message:'No price for ' + sym + ' on or just before that date.'};
    var fx = 1;
    if (fxSym) { var fp = closeOn(fr); if (!fp) throw {code:'no_data', message:'No ' + u.major + '/GBP rate for that date.'}; fx = fp[1]; }
    if (S.ticket !== tk || tk.date !== date) return;
    tk.hist = {date:date, px:p[1], t:p[0], fx:fx, cur:r.currency, type:r.type};
  } catch (e) {
    if (S.ticket !== tk || tk.date !== date) return;
    tk.hist = {date:date, error: e && e.code === 'no_data' ? e.message : issueText(normErr(e)).t};
  }
  renderTicketPreview();
}
async function placeTrade(){
  var tk = S.ticket, P = S.practice;
  if (!P || !tk || !tk.sym || tk.busy) return;
  var pre = ticketCalc();
  if (pre.err) { toast(pre.err); return; }
  if (pre.empty || pre.wait) return;
  if (P.trades.length >= MAX_TRADES) { toast('This practice account is full. Reset it to keep trading.'); return; }
  var past = tk.side === 'buy' && tk.when === 'past';
  tk.busy = true; renderTicketPreview();
  try {
    if (!past) {
      var q0 = S.quotes.get(tk.sym), u0 = unit(q0 && q0.currency), fxs = u0.major && u0.major !== 'GBP' ? u0.major + 'GBP=X' : null;
      ingest(await runFeed({mode:'quotes', symbols:[tk.sym].concat(fxs ? [fxs] : []).join(','), range:'1d'}));
    }
    var c = ticketCalc();
    if (c.err) { toast('Not placed. ' + c.err); return; }
    if (c.empty || c.wait || !c.src) { toast('Not placed. Try again in a moment.'); return; }
    var q = S.quotes.get(tk.sym), src = c.src;
    var trade = {id:'t' + Date.now().toString(36) + Math.random().toString(36).slice(2, 6), sym:tk.sym, name:(q && !q.error && q.name) || tk.sym,
      side:tk.side, qty:c.qty, px:src.px, cur:src.cur || null, type:src.type || '', fx:src.fx, gross:round2(c.gross), stamp:c.stamp, fee:c.fee,
      total:round2(c.total), at: src.past ? new Date(src.t * 1000).toISOString() : new Date().toISOString(), pt: src.t || null, past: !!src.past};
    var next = P.trades.concat([trade]);
    if (!buildBook(P, next).ok) { toast('Not placed. That would leave the account short of cash or shares.'); return; }
    P.trades = next; bookMemo = null; savePractice();
    tk.amount = ''; tk.hist = null; tk.date = ''; tk.when = 'now';
    toast((trade.side === 'buy' ? 'Bought ' : 'Sold ') + fmtQty(trade.qty) + ' ' + trade.sym + ' at ' + fmtPrice(trade.px, trade.cur, trade.type) + (trade.past ? ', backdated' : '') + ' (practice)');
  } catch (e) {
    toast('Not placed. ' + issueText(normErr(e)).t);
  } finally {
    tk.busy = false;
    renderTicket(); renderAll();
  }
}

/* ---------- Toast ---------- */
var toastTimer = null;
function toast(msg){
  var t = $('#toast'); t.textContent = msg; t.classList.add('show');
  clearTimeout(toastTimer); toastTimer = setTimeout(function(){ t.classList.remove('show'); }, 3400);
}

/* ---------- Boot ---------- */
function maybeFirstRefresh(force){
  if (S.firstDone || !mcp) return;
  if (!S.boardLoaded && !force) return;
  S.firstDone = true; refresh();
}
function wireControls(){
  var auto = $('#autoSel'); auto.value = String(prefs.auto);
  if (auto.value !== String(prefs.auto)) { auto.value = '5'; prefs.auto = 5; }
  auto.addEventListener('change', function(){ prefs.auto = Number(auto.value); savePrefs(); schedule(); });
  var sort = $('#sortSel'); sort.value = prefs.sort;
  if (sort.value !== prefs.sort) { sort.value = 'custom'; prefs.sort = 'custom'; }
  sort.addEventListener('change', function(){ prefs.sort = sort.value; savePrefs(); renderList(); });
  $('#refreshBtn').addEventListener('click', function(){ refresh(); });
  document.querySelectorAll('.mode button').forEach(function(b){
    b.addEventListener('click', function(){ setMode(b.getAttribute('data-mode')); });
  });
  var raf = 0;
  if (window.ResizeObserver) new ResizeObserver(function(){
    cancelAnimationFrame(raf);
    raf = requestAnimationFrame(function(){
      if (lastChart && lastChart.host.isConnected && Math.abs((lastChart.host.clientWidth || 0) - Number(lastChart.host.dataset.w || 0)) > 2) drawChart(lastChart.host, lastChart.cfg);
    });
  }).observe($('#dChart'));
}
async function boot(){
  if (location.hash === '#practice') prefs.mode = 'practice';
  wireControls(); wireSearch(); applyModeChrome(); renderForm(); renderAll();
  var C = window.claude;
  function use(n){ return C && typeof C.use === 'function' ? C.use(n).catch(function(){ return null; }) : Promise.resolve(null); }
  use('permissions').then(function(p){ perms = p; });
  (async function(){
    var res = await Promise.all([use('db'), use('user')]);
    var dbNs = res[0], userNs = res[1], uid = null;
    if (userNs) { try { uid = await userNs.id(); } catch (e) {} }
    if (dbNs && uid) {
      try {
        boardRef = dbNs.doc('data/users/' + uid + '/board');
        practiceRef = dbNs.doc('data/users/' + uid + '/practice');
        S.storage = 'db';
        boardRef.onSnapshot(function(snap){ applyBoard(snap.exists ? snap.data() : null); },
          function(){ boardRef = null; useLocal('Your board couldn’t load from your account, so changes save in this browser for now.'); });
        practiceRef.onSnapshot(function(snap){ applyPractice(snap.exists ? snap.data() : null); },
          function(){
            practiceRef = null;
            var pd = null; try { pd = JSON.parse(localStorage.getItem(PRACTICE_KEY) || 'null'); } catch (e) {}
            applyPractice(pd);
          });
        return;
      } catch (e) { boardRef = null; }
    }
    useLocal();
  })();
  mcp = await use('mcp');
  mcpResolved = true;
  applyModeChrome();
  if (!mcp) {
    S.issue = {code:'no_mcp'}; $('#searchInput').disabled = true;
    renderTicket(); renderAll(); return;
  }
  renderAll();
  maybeFirstRefresh();
  setTimeout(function(){ maybeFirstRefresh(true); }, 4000);
}
boot();
})();
</script>
